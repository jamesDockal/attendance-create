spring.application.name=fullstack-challange

spring.datasource.url=jdbc:mysql://localhost:3306/clinic
spring.datasource.username=clinic
spring.datasource.password=clinic

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

protocol.url=${PROTOCOL_URL:https://httpbin.org/uuid}
protocol.timeout=10s

processing.interval=5s
processing.threads=10

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
